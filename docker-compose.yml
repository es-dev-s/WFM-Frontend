services:
  redis:
    image: redis:7-alpine
    container_name: wfm-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: wfm-postgres
    environment:
      POSTGRES_USER: wfm
      POSTGRES_PASSWORD: wfm
      POSTGRES_DB: wfm
    ports:
      - "5433:5432"
    volumes:
      - wfm-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  wfm-pg:
